# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/satchel
spring.datasource.username=postgres
spring.datasource.password=your_password

# Loan parameters
loan.ltv=0.9

# Interest
financial.interest.apy=0.05
financial.interest.accrual-period=30

# Fireblocks / Custodian (use testnet values)
custodian.api.key=${FIREBLOCKS_API_KEY}
custodian.api.secret=${FIREBLOCKS_API_SECRET}
custodian.account.omnibus.id=${FIREBLOCKS_OMNIBUS_ACCOUNT_ID}
custodian.account.omnibus.address=${FIREBLOCKS_OMNIBUS_ACCOUNT_ADDRESS}
# ... other vault IDs and asset identifiers

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-time-ms=3600000