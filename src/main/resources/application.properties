# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/satchel
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

# Loan parameters
loan.ltv=0.9

# Interest
financial.interest.apy=0.05
financial.interest.accrual-period=30
financial.deposit.sweep.min-amount=1

# Fireblocks / Custodian (use testnet values)
custodian.api.key=${FIREBLOCKS_API_KEY}
custodian.api.secret=${FIREBLOCKS_API_SECRET}
custodian.api.public-key=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
custodian.account.omnibus.id=51
custodian.account.omnibus.address=0x8eEAa5d944d1B193241d513F6D29Ac82AEBbAA2a
