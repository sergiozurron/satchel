spring.config.import=optional:file:.env[.properties]

spring.application.name=satchel

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

satchel.financial.accrual-period=${INTEREST_ACCRUAL_PERIOD}
satchel.financial.ltv-check-period=${LTV_CHECK_PERIOD}
satchel.financial.gas-threshold=${GAS_THRESHOLD}
satchel.financial.assets.supported=${SUPPORTED_ASSETS}
# Interest rate on loans
satchel.financial.assets.interest-rate=${ASSETS_INTEREST_RATE}
satchel.financial.assets.ltv=${ASSETS_LTV}
satchel.financial.assets.liquidation-ltv=${ASSETS_LIQUIDATION_LTV}
satchel.financial.assets.fin-margin=${ASSETS_FINANCIAL_MARGIN}
satchel.financial.assets.deposit-sweep-minimum=${ASSETS_DEPOSIT_SWEEP_MIN}
satchel.financial.assets.base-asset=${ASSETS_BASE_ASSET}
