spring.config.import=optional:file:.env[.properties]

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Fireblocks (use testnet values)
satchel.custodian.api.key=${FIREBLOCKS_API_KEY}
satchel.custodian.api.secret=${FIREBLOCKS_API_SECRET}
satchel.custodian.api.public-key=${FIREBLOCKS_PUBLIC_KEY}
satchel.custodian.account.omnibus.id=${FIREBLOCKS_OMNIBUS_ID}
satchel.custodian.account.omnibus.address=${FIREBLOCKS_OMNIBUS_ADDRESS}
satchel.custodian.account.gas-station.id=${FIREBLOCKS_GAS_STATION_ID}
satchel.custodian.account.gas-station.address=${FIREBLOCKS_GAS_STATION_ADDRESS}
satchel.custodian.deposit.sweep.delay=${DEPOSIT_SWEEP_DELAY}

# Trading service
coinbase.api.key-name=${COINBASE_API_KEY_NAME}
coinbase.api.secret=${COINBASE_API_PRIVATE_KEY}

# Fireblocks webhook event types and transaction statuses
satchel.custodian.transaction.status.completed=COMPLETED
satchel.custodian.transaction.substatus.confirmed=CONFIRMED

# Vault name prefixes
satchel.name.deposit.suffix=${DEPOSIT_SUFFIX}

# Mail
satchel.email.service=${MAIL_SERVICE}
satchel.email.sender=${MAIL_SENDER}
satchel.url=${URL}

mailtrap.api.token=${MAILTRAP_API_TOKEN}
mailtrap.api.verification-template=${MAILTRAP_API_VERIFICATION_TEMPLATE}

# JWT (HS256 key, base64). Override with SATCHEL_JWT_SECRET.
satchel.jwt.secret=${JWT_SECRET}
satchel.jwt.expiration-time-ms=${JWT_EXPIRATION_TIME}
