spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Fireblocks (use testnet values)
satchel.custodian.api.key=${FIREBLOCKS_API_KEY}
satchel.custodian.api.secret=${FIREBLOCKS_API_SECRET}
satchel.custodian.api.public-key=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
satchel.custodian.account.omnibus.id=51
satchel.custodian.account.omnibus.address=0x8eEAa5d944d1B193241d513F6D29Ac82AEBbAA2a
satchel.custodian.account.gas-station.id=146
satchel.custodian.account.gas-station.address=0xd8cf72214926F8894eC305B87969d669b9f205E0
satchel.custodian.deposit.sweep.delay=60000


# Fireblocks webhook event types and transaction statuses
satchel.custodian.transaction.status.completed=COMPLETED
satchel.custodian.transaction.substatus.confirmed=CONFIRMED

# Vault name prefixes
satchel.name.deposit.suffix=-deposit

# Mail
satchel.email.service=${MAIL_SERVICE}
satchel.email.sender=${MAIL_SENDER}
satchel.url=http://localhost:8080

mailtrap.api.token=${MAILTRAP_API_TOKEN}
mailtrap.api.verification-template=${MAILTRAP_API_VERIFICATION_TEMPLATE}

# JWT (HS256 key, base64). Override with SATCHEL_JWT_SECRET.
satchel.jwt.secret=${JWT_SECRET}
satchel.jwt.expiration-time-ms=3600000
