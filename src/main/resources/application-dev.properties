spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}

# Loan parameters
satchel.loan.ltv=0.9

# Interest
satchel.financial.interest.apy=0.05
satchel.financial.interest.accrual-period=30
satchel.financial.deposit.sweep.min-amount=1

satchel.assets.supported=ETH_TEST5,USDC_ETH_TEST5_AN74,AVAXTEST,ETH-AETH_SEPOLIA,AMOY_POLYGON_TEST,BNB_TEST

# Fireblocks (use testnet values)
satchel.custodian.api.key=${FIREBLOCKS_API_KEY}
satchel.custodian.api.secret=${FIREBLOCKS_API_SECRET}
satchel.custodian.api.public-key=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
satchel.custodian.account.omnibus.id=51
satchel.custodian.account.omnibus.address=0x8eEAa5d944d1B193241d513F6D29Ac82AEBbAA2a
satchel.custodian.account.omnibus.coin=USDC_ETH_TEST5_AN74
satchel.custodian.account.withdrawal.id=121
satchel.custodian.account.withdrawal.address=0x508c4D4Ea980620cC21EF435fc8B5b5E97C388Fa
satchel.custodian.deposit.sweep.delay=3600000

# Fireblocks webhook event types and transaction statuses
satchel.custodian.webhook.transaction.created=TRANSACTION_CREATED
satchel.custodian.webhook.transaction.updated=TRANSACTION_STATUS_UPDATED
satchel.custodian.webhook.balance.updated=VAULT_BALANCE_UPDATE
satchel.custodian.transaction.status.completed=COMPLETED
satchel.custodian.transaction.substatus.confirmed=CONFIRMED

# Vault name prefixes
satchel.name.deposit.prefix=deposit-

# Mail
satchel.email.service=${MAIL_SERVICE}
satchel.email.sender=${MAIL_SENDER}
satchel.email.verification-url=http://localhost:8080

mailtrap.api.token=${MAILTRAP_API_TOKEN}
mailtrap.api.verification-template=${MAILTRAP_API_VERIFICATION_TEMPLATE}

# JWT (HS256 key, base64). Override with SATCHEL_JWT_SECRET.
satchel.jwt.secret=${JWT_SECRET}
satchel.jwt.expiration-time-ms=3600000

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}

# Github OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET}
